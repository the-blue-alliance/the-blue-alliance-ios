version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: daily
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
  - package-ecosystem: swift
    directories:
      - "/"
      - "/Packages/*"
    schedule:
      interval: daily
    groups:
      # One PR per dependency across the app and package lockfiles, so shared pins move together.
      swift-packages:
        group-by: dependency-name
