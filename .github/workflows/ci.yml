name: CI

# Shared by pull_request.yml and push.yml so the two can't drift apart.
on:
  workflow_call:
    inputs:
      run-tests:
        description: "Whether to run the test jobs"
        type: boolean
        default: true
      save-caches:
        description: "Write build caches. Only main does this, so PR runs can't evict its entries."
        type: boolean
        default: false

jobs:
  swift-format:
    name: swift-format
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Read Xcode version
        id: xcode
        run: echo "version=$(cat .xcode-version)" >> "$GITHUB_OUTPUT"
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ steps.xcode.outputs.version }}
      - name: Lint
        run: ./scripts/swift-format.sh --strict

  dependency-pins:
    name: Dependency pins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check dependency pins
        run: ./scripts/check-dependency-pins.py

  app-icon-previews:
    name: App icon previews
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Read Xcode version
        id: xcode
        run: echo "version=$(cat .xcode-version)" >> "$GITHUB_OUTPUT"
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ steps.xcode.outputs.version }}
      # Regenerate rather than using --check: that compares mtimes, and a fresh
      # checkout gives every file the same timestamp, so it would always pass here.
      - name: Regenerate previews
        run: ./scripts/generate-app-icon-previews.sh --force
      - name: Check previews are up to date
        run: |
          if ! git diff --quiet -- the-blue-alliance-ios/Assets.xcassets/AppIconPreviews; then
            echo "::error::App icon previews are out of date. Run scripts/generate-app-icon-previews.sh and commit the result."
            git diff --stat -- the-blue-alliance-ios/Assets.xcassets/AppIconPreviews
            exit 1
          fi
          if [ -n "$(git status --porcelain -- the-blue-alliance-ios/Assets.xcassets/AppIconPreviews)" ]; then
            echo "::error::App icon previews are missing or untracked. Run scripts/generate-app-icon-previews.sh and commit the result."
            git status --porcelain -- the-blue-alliance-ios/Assets.xcassets/AppIconPreviews
            exit 1
          fi
          echo "App icon previews are up to date."

  test-packages:
    name: Test packages
    if: ${{ inputs.run-tests }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Read Xcode version
        id: xcode
        run: echo "version=$(cat .xcode-version)" >> "$GITHUB_OUTPUT"
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ steps.xcode.outputs.version }}
      - uses: actions/cache@v6
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: ${{ runner.os }}-gems-
      - name: Cache SwiftPM clones
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.swift', '**/Package.resolved', '**/*.pbxproj') }}
          restore-keys: ${{ runner.os }}-spm-
      - name: Restore package build products
        uses: actions/cache/restore@v6
        with:
          path: Packages/*/.build
          key: ${{ runner.os }}-spmbuild-${{ hashFiles('Packages/*/Package.swift', 'Packages/*/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-spmbuild-${{ hashFiles('Packages/*/Package.swift', 'Packages/*/Package.resolved') }}-
            ${{ runner.os }}-spmbuild-
      # These are offline unit tests, so they need neither Secrets.plist nor a
      # signing keychain.
      - name: Install
        run: |
          bundle config set --local path vendor/bundle
          bundle install
      - name: fastlane test_packages
        run: bundle exec fastlane test_packages
      - name: Save package build products
        if: ${{ always() && inputs.save-caches }}
        uses: actions/cache/save@v6
        with:
          path: Packages/*/.build
          key: ${{ runner.os }}-spmbuild-${{ hashFiles('Packages/*/Package.swift', 'Packages/*/Package.resolved') }}-${{ github.sha }}

  test-app:
    name: Test app
    if: ${{ inputs.run-tests }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Read Xcode version
        id: xcode
        run: echo "version=$(cat .xcode-version)" >> "$GITHUB_OUTPUT"
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ steps.xcode.outputs.version }}
      - uses: actions/cache@v6
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: ${{ runner.os }}-gems-
      - name: Cache SwiftPM clones
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.swift', '**/Package.resolved', '**/*.pbxproj') }}
          restore-keys: ${{ runner.os }}-spm-
      - name: Restore DerivedData
        uses: actions/cache/restore@v6
        with:
          path: DerivedData
          key: ${{ runner.os }}-derived-data-${{ hashFiles('**/Package.swift', '**/Package.resolved', '**/*.pbxproj') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-derived-data-${{ hashFiles('**/Package.swift', '**/Package.resolved', '**/*.pbxproj') }}-
            ${{ runner.os }}-derived-data-
      - name: Install
        run: |
          cp mock-Secrets.plist the-blue-alliance-ios/Secrets.plist
          bundle config set --local path vendor/bundle
          bundle install
          bundle exec fastlane run setup_ci
          bundle exec fastlane setup_secrets
        env:
          TBA_API_KEY: ${{ secrets.TBA_API_KEY }}
      - name: fastlane test_app
        run: bundle exec fastlane test_app
      # Logs holds the .xcresult, which result_bundle already copies into
      # fastlane/test_output. Neither is worth carrying in the cache.
      - name: Trim DerivedData
        if: ${{ always() }}
        run: rm -rf DerivedData/Logs DerivedData/Index.noindex
      - name: Save DerivedData
        if: ${{ always() && inputs.save-caches }}
        uses: actions/cache/save@v6
        with:
          path: DerivedData
          key: ${{ runner.os }}-derived-data-${{ hashFiles('**/Package.swift', '**/Package.resolved', '**/*.pbxproj') }}-${{ github.sha }}
