name: CI

# Shared by pull_request.yml and push.yml so the two can't drift apart.
on:
  workflow_call:
    inputs:
      run-tests:
        description: "Whether to run the test jobs"
        type: boolean
        default: true
      save-caches:
        description: "Write build caches. Only main does this, so PR runs can't evict its entries."
        type: boolean
        default: false

jobs:
  swift-format:
    name: swift-format
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Select Xcode
        id: xcode
        run: |
          version="$(cat .xcode-version)"
          dir="/Applications/Xcode_$version.app/Contents/Developer"
          if [ ! -d "$dir" ]; then
            echo "::error::Xcode $version is not installed on this runner image."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "DEVELOPER_DIR=$dir" >> "$GITHUB_ENV"
      - name: Lint
        run: make lint-format

  dependency-pins:
    name: Dependency pins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check dependency pins
        run: make lint-deps

  app-icon-previews:
    name: App icon previews
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Select Xcode
        id: xcode
        run: |
          version="$(cat .xcode-version)"
          dir="/Applications/Xcode_$version.app/Contents/Developer"
          if [ ! -d "$dir" ]; then
            echo "::error::Xcode $version is not installed on this runner image."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "DEVELOPER_DIR=$dir" >> "$GITHUB_ENV"
      # Regenerate rather than using --check: that compares mtimes, and a fresh
      # checkout gives every file the same timestamp, so it would always pass here.
      - name: Regenerate previews
        run: make icons
      - name: Check previews are up to date
        run: |
          if ! git diff --quiet -- the-blue-alliance-ios/Assets.xcassets/AppIconPreviews; then
            echo "::error::App icon previews are out of date. Run scripts/generate-app-icon-previews.sh and commit the result."
            git diff --stat -- the-blue-alliance-ios/Assets.xcassets/AppIconPreviews
            exit 1
          fi
          if [ -n "$(git status --porcelain -- the-blue-alliance-ios/Assets.xcassets/AppIconPreviews)" ]; then
            echo "::error::App icon previews are missing or untracked. Run scripts/generate-app-icon-previews.sh and commit the result."
            git status --porcelain -- the-blue-alliance-ios/Assets.xcassets/AppIconPreviews
            exit 1
          fi
          echo "App icon previews are up to date."

  test-packages:
    name: Test packages
    if: ${{ inputs.run-tests }}
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Select Xcode
        id: xcode
        run: |
          version="$(cat .xcode-version)"
          dir="/Applications/Xcode_$version.app/Contents/Developer"
          if [ ! -d "$dir" ]; then
            echo "::error::Xcode $version is not installed on this runner image."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "DEVELOPER_DIR=$dir" >> "$GITHUB_ENV"
      - name: Cache SwiftPM clones
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.swift', '**/Package.resolved', '**/*.pbxproj') }}
          restore-keys: ${{ runner.os }}-spm-
      # The packages are iOS-only, so their tests build through xcodebuild into
      # DerivedData rather than `swift test` into Packages/*/.build.
      - name: Restore package DerivedData
        uses: actions/cache/restore@v6
        with:
          path: DerivedData
          key: ${{ runner.os }}-xcode${{ steps.xcode.outputs.version }}-packages-derived-data-${{ hashFiles('Packages/*/Package.swift', 'Packages/*/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-xcode${{ steps.xcode.outputs.version }}-packages-derived-data-${{ hashFiles('Packages/*/Package.swift', 'Packages/*/Package.resolved') }}-
            ${{ runner.os }}-xcode${{ steps.xcode.outputs.version }}-packages-derived-data-
      # These are offline unit tests, so they need neither Secrets.plist nor a
      # signing keychain.
      - name: Test packages
        run: make test-packages
      - name: Summarize results
        if: ${{ always() }}
        run: make summary
      # Logs holds the .xcresult, which -resultBundlePath already copies into
      # test_output. Neither is worth carrying in the cache.
      - name: Trim DerivedData
        if: ${{ always() }}
        run: rm -rf DerivedData/Logs DerivedData/Index.noindex
      - name: Save package DerivedData
        if: ${{ always() && inputs.save-caches }}
        uses: actions/cache/save@v6
        with:
          path: DerivedData
          key: ${{ runner.os }}-xcode${{ steps.xcode.outputs.version }}-packages-derived-data-${{ hashFiles('Packages/*/Package.swift', 'Packages/*/Package.resolved') }}-${{ github.sha }}

  test-app:
    name: Test app
    if: ${{ inputs.run-tests }}
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Select Xcode
        id: xcode
        run: |
          version="$(cat .xcode-version)"
          dir="/Applications/Xcode_$version.app/Contents/Developer"
          if [ ! -d "$dir" ]; then
            echo "::error::Xcode $version is not installed on this runner image."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "DEVELOPER_DIR=$dir" >> "$GITHUB_ENV"
      - name: Cache SwiftPM clones
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.swift', '**/Package.resolved', '**/*.pbxproj') }}
          restore-keys: ${{ runner.os }}-spm-
      - name: Restore DerivedData
        uses: actions/cache/restore@v6
        with:
          path: DerivedData
          key: ${{ runner.os }}-xcode${{ steps.xcode.outputs.version }}-derived-data-${{ hashFiles('**/Package.swift', '**/Package.resolved', '**/*.pbxproj') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-xcode${{ steps.xcode.outputs.version }}-derived-data-${{ hashFiles('**/Package.swift', '**/Package.resolved', '**/*.pbxproj') }}-
            ${{ runner.os }}-xcode${{ steps.xcode.outputs.version }}-derived-data-
      - name: Set up Secrets.plist
        run: |
          cp mock-Secrets.plist the-blue-alliance-ios/Secrets.plist
          make secrets
        env:
          TBA_API_KEY: ${{ secrets.TBA_API_KEY }}
      - name: Test app
        run: make test-app
      - name: Summarize results
        if: ${{ always() }}
        run: make summary
      # Logs holds the .xcresult, which -resultBundlePath already copies into
      # test_output. Neither is worth carrying in the cache.
      - name: Trim DerivedData
        if: ${{ always() }}
        run: rm -rf DerivedData/Logs DerivedData/Index.noindex
      - name: Save DerivedData
        if: ${{ always() && inputs.save-caches }}
        uses: actions/cache/save@v6
        with:
          path: DerivedData
          key: ${{ runner.os }}-xcode${{ steps.xcode.outputs.version }}-derived-data-${{ hashFiles('**/Package.swift', '**/Package.resolved', '**/*.pbxproj') }}-${{ github.sha }}
